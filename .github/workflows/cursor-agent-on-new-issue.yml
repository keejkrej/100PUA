name: Cursor agent on new issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify-cursor-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Comment to trigger Cursor cloud agent
        uses: actions/github-script@v7
        with:
          # Use a real user token so @cursoragent mentions are processed.
          # Create a bot/automation user PAT with permission to comment on issues
          # (public_repo for public repos, repo for private repos).
          github-token: ${{ secrets.CURSOR_TRIGGER_PAT }}
          script: |
            const body =
              '@cursoragent please investigate this issue and open a PR with a fix when appropriate.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
