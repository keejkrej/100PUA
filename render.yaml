# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# New > Blueprint > connect this repo. You will be prompted for sync: false secrets.
#
# After the API deploys, open the static site → Environment → add
# PUBLIC_SUGGEST_API_URL = https://<100pua-api service>.onrender.com (no slash),
# then trigger a redeploy. Tighten ALLOWED_ORIGINS on the API for production.
#
# For /explain-prompt: defaults use codex unless you override EXPLAIN_AI_PROVIDER (claude | cursor | codex). See api/.env.example.
#
# Claude: CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
# Cursor: CURSOR_API_KEY (local SDK runtime + platform optional deps).
# Codex: API key or ChatGPT OAuth — see api/.env.example (CODEX_HOME).
#   https://github.com/openai/codex/tree/main/sdk/typescript · codex CLI optional deps.
# Omit Codex env overrides to use API defaults: gpt-5.5, web search live, sandbox danger-full-access, approval never.
# For ChatGPT OAuth on Render, mount a Persistent Disk at /var/data, set CODEX_HOME=/var/data/codex,
# and place auth.json in that directory.
#
# Optional: explain cache survives across instance restarts if you set API env EXPLAIN_CACHE_DIR e.g.
# /var/data/explain-cache together with a Persistent Disk mounted at /var/data.
# Optional: set API env EXPLAIN_KV_URL to your Render Key Value internal URL to add a hot
# Redis-compatible cache in front of the persistent disk cache.

services:
  - type: web
    name: 100pua-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: GITHUB_REPO
        value: keejkrej/100PUA
      - key: GITHUB_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: EXPLAIN_AI_PROVIDER
        value: codex
      - key: CODEX_HOME
        value: /var/data/codex
      - key: EXPLAIN_KV_URL
        sync: false
      - key: EXPLAIN_KV_CACHE_SECONDS
        value: "86400"

  - type: web
    name: 100pua
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PUBLIC_GITHUB_REPO
        value: keejkrej/100PUA
      - key: PUBLIC_EXPLAIN_DEFAULT_PROVIDER
        value: codex
