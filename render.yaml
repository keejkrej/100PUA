# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# New > Blueprint > connect this repo. You will be prompted for sync: false secrets.
#
# For /api/explain-prompt: set CURSOR_API_KEY. For /api/suggestions: set GITHUB_TOKEN.
# Optional: explain cache survives across instance restarts if you set EXPLAIN_CACHE_DIR
# e.g. /var/data/explain-cache together with a Persistent Disk mounted at /var/data.

services:
  - type: web
    name: 100pua
    runtime: node
    plan: free
    buildCommand: npm install && NODE_OPTIONS=--max-old-space-size=8192 npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: GITHUB_REPO
        value: keejkrej/100PUA
      - key: VITE_GITHUB_REPO
        value: keejkrej/100PUA
      - key: GITHUB_TOKEN
        sync: false
      - key: CURSOR_API_KEY
        sync: false
